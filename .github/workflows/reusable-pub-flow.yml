name: Reusable Pub Flow

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      package_path:
        required: true
        type: string
      tag_prefix:
        required: false
        type: string
        default: ''
      release_name_prefix:
        required: false
        type: string
        default: ''
    secrets:
      TOKEN:
        required: false
      PUB_ACCESS_TOKEN:
        required: true
      PUB_REFRESH_TOKEN:
        required: true
      PUB_ID_TOKEN:
        required: true
      PUB_EXPIRATION:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment: pub-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Version
        id: setup
        if: ${{ inputs.mode == 'publish' }}
        run: |
          echo "TAG VERSION: $GITHUB_REF_NAME"
          echo "RELEASE VERSION: ${GITHUB_REF_NAME#${{ inputs.tag_prefix }}}"
          echo "release_name=${GITHUB_REF_NAME#${{ inputs.tag_prefix }}}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6

      - name: Check Flutter Version
        run: |
          flutter doctor -v
          flutter --version

      - name: Setup Pub Credentials
        run: |
          mkdir -p $HOME/.config/dart
          cat <<EOF > $HOME/.config/dart/pub-credentials.json
          {
            "accessToken": "${{ secrets.PUB_ACCESS_TOKEN }}",
            "refreshToken": "${{ secrets.PUB_REFRESH_TOKEN }}",
            "idToken": "${{ secrets.PUB_ID_TOKEN }}",
            "tokenEndpoint": "https://accounts.google.com/o/oauth2/token",
            "scopes": [ "openid", "https://www.googleapis.com/auth/userinfo.email" ],
            "expiration": ${{ secrets.PUB_EXPIRATION }}
          }
          EOF

      - name: Dry Run Publish To Pub Dev
        if: ${{ inputs.mode == 'pre_release' }}
        run: |
          cd "${{ inputs.package_path }}"
          dart pub publish --dry-run

      - name: Publish To Pub Dev
        if: ${{ inputs.mode == 'publish' }}
        run: |
          cd "${{ inputs.package_path }}"
          dart pub publish -f

      - name: Create Release
        if: ${{ inputs.mode == 'publish' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ inputs.release_name_prefix }} ${{ steps.setup.outputs.release_name }}
          draft: false
          prerelease: false
